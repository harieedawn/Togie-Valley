name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Capacitor
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build www (copies index.html, css, js, fonts, icons, vendor, manifest, music into www/)
        run: node tools/build_www.js
      - name: Add Android project
        run: npx cap add android
      - name: Patch Android project (rotation, immersive, keep awake, hw accel, icon)
        run: node tools/android_patch.js
      - name: Sync
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Togie_Valley_apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
